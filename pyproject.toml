[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlens"
version = "0.1.0"
description = "Pictures of a language model's hidden states, drawn by Qwen-Image-2.1 with no text in between: a picture lens across Qwen3-VL-8B's layers and a trained adapter from Qwen3-VL-4B"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SauersML" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10",
    "torchvision",
    "transformers>=5.17",
    "diffusers>=0.42.1",
    "huggingface_hub",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
]

[project.urls]
Repository = "https://github.com/SauersML/vlens"

[tool.setuptools]
packages = ["vlens"]

[tool.setuptools.package-data]
vlens = ["characters.txt"]
